function graph(series,colors=['#65e6b1']){let a=series.map(x=>Math.max(0,Number(x)||0));let max=Math.max(...a,1)*1.12;let w=700,h=195,padX=15,padY=15;let pts=a.map((v,i)=>`${padX+i*(w-2*padX)/Math.max(1,a.length-1)},${h-padY-v/max*(h-2*padY)}`).join(' ');return `<div class="chartbox"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="График"><defs><linearGradient id="gfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4eddb1" stop-opacity=".3"/><stop offset="1" stop-color="#4eddb1" stop-opacity="0"/></linearGradient></defs>${[0,.25,.5,.75,1].map(t=>`<line x1="0" y1="${padY+(h-2*padY)*t}" x2="${w}" y2="${padY+(h-2*padY)*t}" stroke="#2a465a" stroke-width="1"/>`).join('')}<polygon points="${padX},${h} ${pts} ${w-padX},${h}" fill="url(#gfill)"/><polyline points="${pts}" stroke="${colors[0]}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${a.map((v,i)=>`<circle r="4" cx="${padX+i*(w-2*padX)/Math.max(1,a.length-1)}" cy="${h-padY-v/max*(h-2*padY)}" fill="${colors[0]}"/>`).join('')}</svg></div>`}
function donut(parts){let palette=['#f1c56f','#54dda7','#8caaff','#d18fe0','#f18b94','#8faec3'];let totalv=parts.reduce((s,x)=>s+x.amount,0)||1,off=0;let rings=parts.map((p,i)=>{let len=p.amount/totalv*100;let o=`<circle cx="88" cy="88" r="66" fill="none" stroke="${palette[i%palette.length]}" stroke-width="20" stroke-dasharray="${len} ${100-len}" stroke-dashoffset="${-off}" pathLength="100"/>`;off+=len;return o}).join('');return `<div class="donutrow"><div class="donut"><svg viewBox="0 0 176 176"><circle cx="88" cy="88" r="66" stroke="#264153" stroke-width="20" fill="none"/>${rings}</svg><div class="center">${rub(totalv)}<small>за месяц</small></div></div><div class="legend">${parts.map((p,i)=>`<div class="mini-row"><span><i style="background:${palette[i%palette.length]}"></i>${enc(p.name)}</span><strong>${pct(p.amount/totalv)}</strong></div>`).join('')}</div></div>`}

function annuity(P,monthly,n){if(n<=0)return P;if(Math.abs(monthly)<1e-12)return P/n;let x=Math.pow(1+monthly,-n);return P*monthly/(1-x)}
// Each early repayment has its own date/range and its own recalculation policy.
// ACT/365 for interest; monthly scheduled dates are anchored to the original issue date.
function schedule(loan,prepayments){
 const P=Number(loan.principal),rate=Number(loan.rate)/100,period=Math.round(Number(loan.years)*12+Number(loan.months)),start=parseDate(loan.start);
 if(!Number.isFinite(P)||P<=0||!Number.isFinite(rate)||rate<0||rate>1||period<1||period>600||!Number.isFinite(start.getTime()))throw Error('Проверьте сумму, ставку, срок и дату начала кредита.');
 let rem=P,rows=[],prev=start,monthly=annuity(P,rate/12,period),principalPart=P/period,interestSum=0,extraSum=0,nextDayCarry=0;
 const events=Array.isArray(prepayments)?prepayments:[];
 for(let i=1;i<=period;i++){
  const due=addMonths(start,i),d=days(prev,due);
  let interest=fix(rem*rate*d/365+nextDayCarry);nextDayCarry=0;
  let scheduled=loan.type==='diff'?Math.min(rem+interest,principalPart+interest):Math.min(rem+interest,monthly);
  if(scheduled<interest)scheduled=interest+Math.min(rem,monthly);
  scheduled=fix(scheduled);
  let toward=fix(Math.min(rem,Math.max(0,scheduled-interest)));
  rem=fix(rem-toward);interestSum+=interest;
  let extra=0,extraDate=null,operations=[];
  for(const event of events){
   let from=Number(event.from)||1,to=Number(event.to)||0;
   let active=i>=from&&(event.repeat==='monthly'?(event.untilEnd||to===0||i<=to):i===from);
   if(!active||rem<=.01)continue;
   let amount=Math.min(rem,event.full?rem:Math.max(0,Number(event.extra)||0));
   if(amount<=0)continue;
   amount=fix(amount);
   const eventDate=new Date(due);
   if(event.when==='next')eventDate.setDate(eventDate.getDate()+1);
   rem=fix(rem-amount);extra=fix(extra+amount);extraSum+=amount;
   if(event.when==='next')nextDayCarry+=amount*rate/365;
   extraDate=iso(eventDate);
   operations.push({id:event.id,amount,date:iso(eventDate),mode:event.mode});
   if(event.mode==='payment'&&!event.full){
    let left=Math.max(1,period-i);
    if(loan.type==='annuity')monthly=annuity(rem,rate/12,left);
    else principalPart=rem/left;
   }
  }
  rows.push({i,date:due,iso:iso(due),scheduled,interest,principal:toward,extra,extraDate,total:fix(scheduled+extra),balance:rem,operations});
  prev=due;
  if(rem<=.01)break;
  if(i>=period){let last=rows[rows.length-1];if(rem>.01){last.scheduled=fix(last.scheduled+rem);last.principal=fix(last.principal+rem);last.total=fix(last.total+rem);rem=0;last.balance=0;}break;}
 }
 const paid=fix(rows.reduce((sum,r)=>sum+r.total,0));
 return {rows,interest:fix(interestSum),extra:fix(extraSum),paid,finish:rows.at(-1)?.iso,period:rows.length,payment:rows[0]?.scheduled||0};
}
function paymentDates(l){let n=Math.max(1,Math.min(600,Math.round(Number(l.years)*12+Number(l.months))||1)),start=parseDate(l.start);if(!Number.isFinite(start.getTime()))return [];return Array.from({length:n},(_,i)=>({i:i+1,iso:iso(addMonths(start,i+1)),label:dateRu(addMonths(start,i+1))}));}

function formRepay(){
 const p=state.pre,l=state.loan,dates=paymentDates(l),items=state.prepayments;
 let from=Math.max(1,Math.min(dates.length||1,Number(p.from)||1));
 let end=Math.max(from,Math.min(dates.length||1,Number(p.to)||dates.length));
 const f=(label,id,value,type='number')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${enc(value)}" ${type==='number'?'min="0" step="any"':''}></div>`;
 const list=items.length?items.slice().sort((a,b)=>a.from-b.from||a.id-b.id).map((x,j)=>{
  const first=dates[Math.max(0,Math.min(dates.length-1,(Number(x.from)||1)-1))];
  const last=dates[Math.max(0,Math.min(dates.length-1,(Number(x.to)||1)-1))];
  const when=x.when==='next'?' · на следующий день':'';
  const span=x.repeat==='monthly'?`${first?.label||'—'} — ${x.untilEnd?'до закрытия':last?.label||'—'}`:first?.label||'—';
  return `<div class="lineitem repay-item"><div class="repay-info"><div class="name">${x.repeat==='monthly'?'↻ Каждый месяц':'◉ Разовый платёж'} · ${rub(x.extra)}</div><div class="detail">${span}${when}</div><div class="detail"><span class="tag">${x.mode==='payment'?'Уменьшить платёж':'Уменьшить срок'}</span></div></div><div class="controls"><button class="btn small" data-editpre="${x.id}">Изменить</button><button class="btn danger small" data-delpre="${x.id}" aria-label="Удалить">×</button></div></div>`;
 }).join(''):'<div class="empty" style="padding:18px 8px">Погашений пока нет.</div>';
 let editor=state.preEditor?`<div class="divider"></div><h3 style="margin-bottom:12px">${state.editingPreId==null?'Новое погашение':'Изменить погашение'}</h3>
 <div class="field"><label>Периодичность</label><div class="segmented"><button data-repeat="once" class="${p.repeat==='once'?'active':''}">Один раз</button><button data-repeat="monthly" class="${p.repeat==='monthly'?'active':''}">Ежемесячно</button></div></div>
 <div class="fields section-gap">${f('Досрочная сумма, ₽','preExtra',p.extra)}
 <div class="field"><label for="preFrom">${p.repeat==='monthly'?'Первый платёж':'Дата платежа'}</label>${dateSelect('preFrom',dates,from)}</div>
 ${p.repeat==='monthly'?`<div class="field" id="preToWrap"><label for="preTo">Последний платёж</label>${dateSelect('preTo',dates,end)}</div><label class="toggle" id="preUntilWrap"><input type="checkbox" id="preUntilEnd" ${p.untilEnd?'checked':''}> До полного погашения</label>`:''}
 <div class="field"><label for="preWhen">Когда внести?</label><select id="preWhen"><option value="same" ${p.when==='same'?'selected':''}>В день платежа</option><option value="next" ${p.when==='next'?'selected':''}>На следующий день</option></select></div>
 <div class="field"><label for="preMode">Что уменьшить?</label><select id="preMode"><option value="term" ${p.mode==='term'?'selected':''}>Срок кредита</option><option value="payment" ${p.mode==='payment'?'selected':''}>Ежемесячный платёж</option></select></div>
 </div><div class="formactions"><button class="btn primary" id="applyPre">${state.editingPreId==null?'Добавить погашение':'Сохранить изменения'}</button><button class="btn" id="cancelPre">Отмена</button></div>`:'';
 return `<div class="panel gold-line"><div class="split-header"><h3>◈ Досрочные погашения</h3><span class="tag">${items.length} ${items.length===1?'операция':'операций'}</span></div>
 <div class="hint">Добавляйте несколько погашений: у каждого своя дата, сумма и способ пересчёта.</div>
 <div class="section-gap">${list}</div>
 ${!state.preEditor?`<button class="btn primary block section-gap" id="newPre">+ Добавить погашение</button>`:''}
 ${editor}
 <div class="hint section-gap">Досрочная сумма указывается <strong>сверх обязательного платежа</strong>. Все операции учитываются по порядку.</div></div>`;
}
function termRu(months){
 let n=Math.max(0,Math.round(months));let years=Math.floor(n/12),rem=n%12;
 return [years?years+' '+(years%10===1&&years%100!==11?'год':years%10>=2&&years%10<=4&&(years%100<12||years%100>14)?'года':'лет'):'',rem?rem+' мес.':''].filter(Boolean).join(' ')||'0 мес.';
}
function compactRow(label,value,accent='',note=''){
 return `<div class="comparison-row"><div class="comparison-label">${label}${note?`<small>${note}</small>`:''}</div><strong class="${accent}">${value}</strong></div>`;
}
function summaryLoan(){
 const x=currentSchedule,b=baseSchedule,l=state.loan;
 const down=Number(l.downPayment||0),financed=Number(l.principal)-down;
 const hasEarly=x.extra>0.01, savedInterest=Math.max(0,b.interest-x.interest),savedMonths=Math.max(0,b.period-x.period);
 const lastRegular=x.rows.length>1?x.rows[x.rows.length-2]:x.rows[0];
 const postPayment=lastRegular?.scheduled||x.payment;
 const hasPaymentChange=hasEarly&&l.type==='annuity'&&x.rows.some((r,i)=>r.operations?.some(op=>op.mode==='payment')&&i<x.rows.length-1);
 const deltaPayment=hasPaymentChange?Math.max(0,b.payment-postPayment):0;
 let html=`<div class="panel resultHero"><div class="headline">${l.type==='annuity'?'Ежемесячный платёж при выдаче':'Первый ежемесячный платёж'}</div><div class="big-number">${rub(b.payment)}</div><div class="hint">${l.type==='diff'?'Дифференцированный график: обязательные платежи постепенно снижаются.':'Аннуитетный график: платежи пересчитываются после досрочных погашений, выбранных на уменьшение платежа.'}</div></div>`;
 html+=`<div class="panel section-gap compare-panel"><div class="compare-heading"><span class="compare-index">01</span><div><div class="compare-kicker">На момент выдачи</div><h3>Исходные условия</h3></div></div>
 ${compactRow('Стоимость покупки',rub(l.principal))}
 ${compactRow('Первоначальный взнос',rub(down))}
 ${compactRow('Сумма кредита',rub(financed),'gold')}
 ${compactRow('Срок кредита',termRu(b.period))}
 ${compactRow('Дата закрытия',b.finish?dateRu(parseDate(b.finish)):'—')}
 ${compactRow('Проценты банку',rub(b.interest))}
 ${compactRow('Всего выплат банку',rub(b.paid))}
 ${compactRow('Полная стоимость с взносом',rub(down+b.paid))}
 <div class="compare-separator"><span></span><b>ПОСЛЕ ДОСРОЧНЫХ ПОГАШЕНИЙ</b><span></span></div>`;
 if(!hasEarly){
   html+=`<div class="comparison-empty">Добавьте досрочное погашение слева — здесь появятся новый срок, платёж и экономия по процентам.</div>`;
 }else{
   html+=`<div class="compare-heading after-heading"><span class="compare-index after-index">02</span><div><div class="compare-kicker">С учётом всех операций</div><h3>Новый график</h3></div></div>
   ${compactRow('Досрочно внесено',rub(x.extra),'gold')}
   ${compactRow('Новый срок',termRu(x.period),'green')}
   ${compactRow('Сокращение срока',savedMonths?('− '+termRu(savedMonths)):'Без изменения','green')}
   ${compactRow('Новая дата закрытия',x.finish?dateRu(parseDate(x.finish)):'—','green')}
   ${compactRow('Проценты банку',rub(x.interest))}
   ${compactRow('Экономия на процентах','− '+rub(savedInterest),'green')}
   ${compactRow('Всего выплат банку',rub(x.paid))}
   ${compactRow('Полная стоимость с взносом',rub(down+x.paid))}
   ${hasPaymentChange?compactRow('Обязательный платёж после пересчёта',rub(postPayment),'green','Платёж перед последним закрывающим взносом'):''}
   ${hasPaymentChange?compactRow('Снижение платежа',deltaPayment>0?'− '+rub(deltaPayment):'Без снижения','green','Относительно платежа при выдаче'):''}`;
 }
 html+='</div>';
 return html;
}
function tableLoan(){let rows=currentSchedule.rows;let avail=state.view==='compare'?baseSchedule.rows:rows;let totalrows=avail.length;return `<div class="panel section-gap"><div class="split-header"><h3>График платежей</h3><span class="tag">${totalrows} платежей</span></div><div class="tabs"><button data-view="schedule" class="${state.view==='schedule'?'active':''}">С учётом досрочных</button><button data-view="compare" class="${state.view==='compare'?'active':''}">Без досрочных</button></div><div class="tablewrap"><table class="schedule"><thead><tr><th>№</th><th>Дата</th><th>Обязательный</th><th>Проценты</th><th>Основной долг</th><th>Досрочно</th><th>Всего</th><th>Остаток</th></tr></thead><tbody>${avail.map(r=>`<tr class="${r.extra?'extra':''}"><td>${r.i}</td><td>${dateRu(r.date)}${(r.operations||[]).map(op=>`<div style="font-size:10px;color:#ecc77d">+ ${rub(op.amount)} · ${dateRu(parseDate(op.date))} · ${op.mode==='payment'?'снижение платежа':'снижение срока'}</div>`).join('')}</td><td>${rub(r.scheduled)}</td><td>${rub(r.interest)}</td><td>${rub(r.principal)}</td><td>${r.extra?rub(r.extra):'—'}</td><td>${rub(r.total)}</td><td>${rub(r.balance)}</td></tr>`).join('')}</tbody></table></div><div class="hint section-gap">В таблице можно прокручивать столбцы. Суммы округлены до рублей для показа; расчёт ведётся с точностью до копеек.</div></div>`}
function credit(){let error='';try{let net=Number(state.loan.principal)-Number(state.loan.downPayment||0);if(!Number.isFinite(net)||net<=0)throw Error('Первоначальный взнос должен быть меньше стоимости покупки.');let effectiveLoan={...state.loan,principal:net};baseSchedule=schedule(effectiveLoan,null);currentSchedule=schedule(effectiveLoan,state.prepayments)}catch(e){error=e.message}let l=state.loan;let content=title('Кредитный калькулятор','Кредит / Ипотека','Детальный расчёт, график и досрочные погашения.')+`<div class="grid cols2 credit-main"><div>${loanForm()}<div class="section-gap">${formRepay()}</div></div><div>${error?`<div class="callout warning">${enc(error)}</div>`:summaryLoan()+`<div class="panel section-gap"><h3>Остаток долга по месяцам</h3>${graph(currentSchedule.rows.filter((r,i)=>i%Math.max(1,Math.ceil(currentSchedule.rows.length/24))===0).map(r=>r.balance))}<div class="hint">Остаток основного долга после платежа.</div></div>`}</div></div>`;if(!error)content+=tableLoan();content+=`<div class="note-bottom">Калькулятор предназначен для предварительных оценок. Фактические суммы зависят от договора, банковского порядка начисления процентов, условий досрочного погашения и возможных комиссий или страхования. Расчётные данные не являются банковской выпиской.</div>`;return content}
function render(){nav();const h={home,transactions,credit,goals,analytics,settings}[state.page]();q('#app').innerHTML=h;attach();save()}
function setPage(id){state.page=id;window.scrollTo({top:0,behavior:'smooth'});render()}
function readLoan(){let l=state.loan;l.principal=num('loanPrincipal');l.downPayment=num('loanDownPayment');l.rate=num('loanRate');l.years=num('loanYears');l.months=0;l.start=val('loanStart');l.type=val('loanType');if(l.principal<=0||l.downPayment<0||l.downPayment>=l.principal||l.rate<0||l.rate>100||l.years<1||l.years>50)throw Error('Проверьте стоимость, взнос, ставку и срок (1–50 лет).');let dt=parseDate(l.start);if(!l.start||!/^\d{4}-\d{2}-\d{2}$/.test(l.start)||!Number.isFinite(dt.getTime())||iso(dt)!==l.start||l.start<'2000-01-01'||l.start>'2100-12-31')throw Error('Выберите дату выдачи с 2000 по 2100 год.');}
function readPre(){
 let p=state.pre;if(!state.preEditor)return;
 p.extra=num('preExtra');p.from=Math.max(1,Math.round(num('preFrom')));
 p.to=Math.max(1,Math.round(num('preTo')||p.from));
 p.untilEnd=p.repeat==='monthly'&&!!q('#preUntilEnd')?.checked;
 p.when=val('preWhen')||'same';p.mode=val('preMode')||'term';p.full=false;
 if(!p.untilEnd&&p.repeat==='monthly'&&p.to<p.from)throw Error('Дата окончания должна быть не раньше начала периода.');
 if(p.extra<=0||!Number.isFinite(p.extra))throw Error('Укажите сумму досрочного платежа больше нуля.');
}
function openTransaction(id=null){state.transactionEditor={type:state.filter==='income'?'income':'expense',id};render();const f=q('#transactionForm');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});}
function commitTransaction(ev){
 ev.preventDefault();const ed=state.transactionEditor;if(!ed)return;
 const arr=ed.type==='income'?state.incomes:state.expenses;
 const item=ed.id==null?null:arr.find(x=>String(x.id)===String(ed.id));
 const name=String(val('txName')||'').trim();const raw=String(val('txAmount')||'').trim().replace(',','.');const amount=Number(raw);
 const error=q('#txError');
 if(!name||raw===''||!Number.isFinite(amount)||amount<0||amount>1e12){if(error){error.textContent='Укажите название и корректную сумму от 0 до 1 трлн ₽.';error.style.color='var(--red)'}return;}
 if(item){item.amount=amount;if(!['core-food','core-rent','core-self'].includes(String(item.id)))item.name=name;
 if(ed.type==='expense'&&!['core-food','core-rent','core-self'].includes(String(item.id)))item.category=val('txCategory')||'planned';}
 else arr.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),name,amount,...(ed.type==='expense'?{category:val('txCategory')||'planned'}:{})});
 state.transactionEditor=null;render();
}
function attach(){const preview=()=>{let amount=Number(q('#loanPrincipal')?.value||0),down=Number(q('#loanDownPayment')?.value||0),el=q('#loanNetPreview');if(el)el.innerHTML='Сумма кредита: <strong>'+rub(Math.max(0,amount-down))+'</strong>'+(down>=amount?' · Взнос должен быть меньше стоимости покупки':'')};q('#loanPrincipal')?.addEventListener('input',preview);q('#loanDownPayment')?.addEventListener('input',preview);document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>setPage(el.dataset.page)));document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;state.transactionEditor=null;render()}));q('#newTransaction')?.addEventListener('click',()=>openTransaction());q('#transactionForm')?.addEventListener('submit',commitTransaction);q('#cancelTransaction')?.addEventListener('click',()=>{state.transactionEditor=null;render()});q('#cancelTransactionBottom')?.addEventListener('click',()=>{state.transactionEditor=null;render()});
 q('#focusGoal')?.addEventListener('change',e=>{state.focusGoal=e.target.value;render()});
 document.querySelectorAll('[data-editop]').forEach(b=>b.addEventListener('click',()=>openTransaction(b.dataset.editop)));document.querySelectorAll('[data-delop]').forEach(b=>b.addEventListener('click',()=>{let a=state.filter==='income'?state.incomes:state.expenses;let i=a.findIndex(x=>String(x.id)===String(b.dataset.delop));if(i>=0&&confirm('Удалить категорию?')){a.splice(i,1);render()}}));
 q('#newGoal')?.addEventListener('click',()=>{let name=prompt('Название цели:','Новая цель');if(name===null)return;let n=Number(prompt('Сколько нужно накопить, ₽:','100000'));if(name.trim()&&n>0){state.goals.push({id:Date.now(),name,target:n,saved:0});render()}});
 document.querySelectorAll('[data-addgoal]').forEach(b=>b.addEventListener('click',()=>{let g=state.goals.find(x=>x.id===Number(b.dataset.addgoal));let n=Number(prompt('Сколько добавить к накоплениям, ₽:','10000'));if(g&&n>0){g.saved+=n;render()}}));document.querySelectorAll('[data-editgoal]').forEach(b=>b.addEventListener('click',()=>{let g=state.goals.find(x=>x.id===Number(b.dataset.editgoal));if(!g)return;let name=prompt('Название цели:',g.name);if(name===null)return;let n=Number(prompt('Сумма цели, ₽:',g.target));if(name.trim()&&n>0){g.name=name;g.target=n;render()}}));document.querySelectorAll('[data-delgoal]').forEach(b=>b.addEventListener('click',()=>{if(confirm('Удалить цель?')){state.goals=state.goals.filter(x=>x.id!==Number(b.dataset.delgoal));render()}}));
 document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{try{readLoan()}catch(e){alert(e.message);return}state.loan.kind=b.dataset.kind;render()}));
 q('#newPre')?.addEventListener('click',()=>{try{readLoan()}catch(e){alert(e.message);return;}state.pre=defaultPre();state.preEditor=true;state.editingPreId=null;render();});
 document.querySelectorAll('[data-repeat]').forEach(b=>b.addEventListener('click',()=>{
  try{readLoan();readPre()}catch(e){if(!e.message.includes('сумму досрочного')){alert(e.message);return;}}
  state.pre.repeat=b.dataset.repeat;render();
 }));
 q('#preUntilEnd')?.addEventListener('change',()=>{if(q('#preTo'))q('#preTo').disabled=q('#preUntilEnd').checked;});
 if(q('#preTo'))q('#preTo').disabled=!!q('#preUntilEnd')?.checked;
 q('#calculateLoan')?.addEventListener('click',()=>{try{readLoan();state.loanActive=true;render()}catch(e){alert(e.message)}});
 q('#applyPre')?.addEventListener('click',()=>{try{
  readLoan();readPre();let e={...state.pre,id:state.editingPreId??Date.now()};
  let idx=state.prepayments.findIndex(x=>String(x.id)===String(e.id));
  if(idx>=0)state.prepayments[idx]=e;else state.prepayments.push(e);
  state.preEditor=false;state.editingPreId=null;state.loanActive=true;render();
 }catch(e){alert(e.message)}});
 q('#cancelPre')?.addEventListener('click',()=>{state.preEditor=false;state.editingPreId=null;render()});
 document.querySelectorAll('[data-editpre]').forEach(b=>b.addEventListener('click',()=>{
  const item=state.prepayments.find(x=>String(x.id)===b.dataset.editpre);if(!item)return;
  state.pre={...defaultPre(),...item};state.preEditor=true;state.editingPreId=item.id;render();
 }));
 document.querySelectorAll('[data-delpre]').forEach(b=>b.addEventListener('click',()=>{
  if(!confirm('Удалить досрочное погашение?'))return;
  state.prepayments=state.prepayments.filter(x=>String(x.id)!==b.dataset.delpre);render();
 }));
 document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{try{readLoan();readPre()}catch{}state.view=b.dataset.view;render()}));
 q('#exportData')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finkontrol_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)});
 q('#importData')?.addEventListener('click',()=>q('#importFile').click());q('#importFile')?.addEventListener('change',ev=>{let file=ev.target.files[0];if(!file)return;file.text().then(s=>{let obj=JSON.parse(s);if(!Array.isArray(obj.incomes)||!Array.isArray(obj.expenses)||!obj.loan)throw Error('Неверный формат');state={...defaults(),...obj,page:'settings'};state.loan={...defaults().loan,...obj.loan};state.pre={...defaultPre(),...obj.pre};state.prepayments=Array.isArray(obj.prepayments)?obj.prepayments:[];state.preEditor=false;state.editingPreId=null;normalizeCategories();render();alert('Данные импортированы')}).catch(()=>alert('Неподдерживаемый файл резервной копии.'))});q('#resetData')?.addEventListener('click',()=>{if(confirm('Удалить все сохранённые данные и вернуть демонстрацию?')){state=defaults();render()}});
}
render();
</script><script id="fcSplashScript">
(function(){
  var splash=document.getElementById('fcSplash');
  if(!splash)return;
  var done=false;
  function closeSplash(){if(done)return;done=true;splash.classList.add('fc-hide');setTimeout(function(){splash.remove()},520)}
  document.getElementById('fcSplashSkip').addEventListener('click',closeSplash);
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(closeSplash,reduced?1200:2450);
})();
</script></body></html>
